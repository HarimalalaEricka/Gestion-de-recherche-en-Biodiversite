spring.application.name=biodiversity

spring.datasource.url=jdbc:postgresql://localhost:5433/nexora
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuration du JWT
jwt.secret=nexora-cle-secrete-a-changer-absolument-32-caracteres-minimum
jwt.expiration-ms=86400000
app.cors.origins=http://localhost:5173,http://localhost:3000,http://localhost:8081

# Adresse du frontend (pour fabriquer le lien dans l'e-mail)
app.frontend-url=http://localhost:5173
