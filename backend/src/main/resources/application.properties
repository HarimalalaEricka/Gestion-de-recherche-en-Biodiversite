spring.application.name=biodiversity

spring.datasource.url=jdbc:postgresql://localhost:5433/nexora
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuration du JWT
jwt.secret=nexora-cle-secrete-a-changer-absolument-32-caracteres-minimum
jwt.expiration-ms=86400000
app.cors.origins=http://localhost:5173,http://localhost:3000,http://localhost:8081

# Adresse du frontend (pour fabriquer le lien dans l'e-mail)
app.frontend-url=http://localhost:5173
# Durée de validité du lien : 1 heure (en minutes)
app.reset-token-minutes=60

# Envoi d'e-mails (exemple Gmail : utilisez un "mot de passe d'application", pas votre mot de passe normal)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=votre.adresse@gmail.com
spring.mail.password=mot-de-passe-d-application
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true